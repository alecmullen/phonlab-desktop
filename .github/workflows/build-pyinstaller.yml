on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pyinstaller-build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install

      - name: Create Executable
        id: create-executable
        run:  |
            uv sync --locked --group build
            uv run pyinstaller src/phonlab_desktop.py --name "Phonlab" --windowed --additional-hooks-dir=pyinstaller_hooks

      - name: Warm Numba Cache
        run: |
          PHONLAB_WARMUP_ONLY=1 "dist/Phonlab.app/Contents/MacOS/Phonlab"
        shell: bash

      - name: Create Installer
        run: |
          chmod +x ./script/create-phonlab-dmg.sh
          ./script/create-phonlab-dmg.sh dist/Phonlab.app Phonlab-Installer.dmg
        shell: bash

      - name: (Upload) Executable
        uses: actions/upload-artifact@v4
        with:
          name: Phonlab Mac (Apple Silicon)
          path: Phonlab-Installer.dmg

  pyinstaller-build-mac-intel:
    runs-on: macos-15-intel
    steps:
      - name: Install llvm
        run: |
          brew install llvm@22
          echo "CMAKE_PREFIX_PATH=/usr/local/opt/llvm@22" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install

      - name: Create Executable
        id: create-executable
        run:  |
            uv sync --locked --group build
            uv run pyinstaller src/phonlab_desktop.py --name "Phonlab" --windowed --additional-hooks-dir=pyinstaller_hooks

      - name: Warm Numba Cache
        run: |
          PHONLAB_WARMUP_ONLY=1 "dist/Phonlab.app/Contents/MacOS/Phonlab"
        shell: bash

      - name: Create Installer
        run: |
          chmod +x ./script/create-phonlab-dmg.sh
          ./script/create-phonlab-dmg.sh dist/Phonlab.app Phonlab-Installer.dmg
        shell: bash

      - name: (Upload) Executable
        uses: actions/upload-artifact@v4
        with:
          name: Phonlab Mac (Intel)
          path: Phonlab-Installer.dmg

  pyinstaller-build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install

      - name: Create Executable
        id: create-executable
        run:  |
            uv sync --locked --group build
            uv run pyinstaller src/phonlab_desktop.py --name "Phonlab" --windowed --additional-hooks-dir=pyinstaller_hooks

      - name: Warm Numba Cache
        shell: pwsh
        run: |
          $env:PHONLAB_WARMUP_ONLY = "1"
          & "dist\Phonlab\Phonlab.exe"

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: script/phonlab_inno_script.iss
          options: /O+

      - name: (Upload) Executable
        uses: actions/upload-artifact@v4
        with:
          name: Phonlab Windows
          path: script/Output/Phonlab Installer.exe

  pyinstaller-build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install

      - name: Create Executable
        id: create-executable
        run:  |
            uv sync --locked --group build
            uv run pyinstaller src/phonlab_desktop.py --name "Phonlab" --windowed --additional-hooks-dir=pyinstaller_hooks

      - name: Create tarball
        run: |
          tar -czvf phonlab.tar.gz  -C dist/Phonlab .
          
      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phonlab Debian x64
          path: phonlab.tar.gz
