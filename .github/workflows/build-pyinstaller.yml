on:
  workflow_dispatch

jobs:
  pyinstaller-build-mac:
    runs-on: macos-latest
    steps:
      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          upload_exe_with_name: 'Phonlab Mac'
          options: --name "Phonlab", --windowed, --one-file

  pyinstaller-build-windows:
    runs-on: windows-latest
    steps:
      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          upload_exe_with_name: 'Phonlab Windows'
          options: --name "Phonlab", --windowed, --one-file

  pyinstaller-build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          upload_exe_with_name: 'Phonlab Linux'
          options: --name "Phonlab", --windowed, --one-file
