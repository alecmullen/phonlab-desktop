on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pyinstaller-build-mac:
    runs-on: macos-latest
    steps:
      - name: Create Executable
        id: create-executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          options: --onefile, --name "Phonlab", --windowed
      - name: Create Installer
        run: |
          chmod +x ./script/create-phonlab-dmg.sh
          ./script/create-phonlab-dmg.sh ${{steps.create-executable.outputs.executable_path}} Phonlab-Installer.dmg
        shell: bash
      - name: (Upload) Executable
        uses: actions/upload-artifact@v4
        with:
          name: Phonlab Mac (Apple Silicon)
          path: Phonlab-Installer.dmg

  pyinstaller-build-mac-intel:
    runs-on: macos-15-intel
    steps:
      - name: Install LLVMLite
        run: |
          brew install llvm@22
          echo "CMAKE_PREFIX_PATH=/usr/local/opt/llvm@22" >> $GITHUB_ENV
      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          upload_exe_with_name: 'Phonlab Mac (Intel)'
          options: --onefile, --name "Phonlab", --windowed

  pyinstaller-build-windows-dir:
    runs-on: windows-latest
    steps:
      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          upload_exe_with_name: 'Phonlab Windows Dir'
          options: --name "Phonlab", --windowed

  pyinstaller-build-windows:
    runs-on: windows-latest
    steps:
      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          upload_exe_with_name: 'Phonlab Windows'
          options: --onefile, --name "Phonlab", --windowed

  pyinstaller-build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.12.10'
          spec: 'src/phonlab_desktop.py'
          requirements: 'requirements.txt'
          upload_exe_with_name: 'Phonlab Linux'
          options: --onefile, --name "Phonlab", --windowed
